[package]
name = "deepwhale-desktop"
version = "0.1.2"
description = "DeepSeek 余额小鲸鱼桌面版"
edition = "2021"
rust-version = "1.77.2"
default-run = "deepwhale-desktop"

[[bin]]
name = "tts_gen"
path = "src/bin/tts_gen.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
time = { version = "0.3", features = ["local-offset", "macros"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "native-tls"] }
http = "1"
futures-util = "0.3.34"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
