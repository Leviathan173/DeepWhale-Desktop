<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>小鲸鱼余额挂件</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    body {
      font-family: "Microsoft YaHei", system-ui, "Segoe UI", sans-serif;
    }
    /* 注意：--dshw-base 由 JS 按 SCREEN 尺寸注入（小窗 = 窗口尺寸，不能在 CSS 用
       100vw/100vh —— 那是窗口自身，会循环自引用）。这里的 275px 只是加载瞬间的兜底。 */
    .dshwv-root{position:fixed;left:0;bottom:0;--dshw-scale:1;--dshw-base:275px;width:var(--dshw-base);height:var(--dshw-base);pointer-events:none;user-select:none;-webkit-user-select:none;z-index:9999;font-family:inherit;transition:transform .13s ease-out}
    .dshwv-root.dshwv-left{transform:scaleX(-1)}
    .dshwv-root.dshwv-dragging{cursor:grabbing;transition:none}
    .dshwv-body{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 100%;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
     .dshwv-img{position:absolute;right:0;top:calc(var(--dshw-base) * .4055);width:59.45%;height:59.45%;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none;transition:top .2s ease}
     .dshwv-root:not(.dshwv-classic) .dshwv-img{display:none}
     .dshwv-root.dshwv-top .dshwv-img{top:0}
     .dshwv-dsh-stage{position:absolute;right:calc(var(--dshw-base) * .04);bottom:calc(var(--dshw-base) * .03);width:calc(var(--dshw-base) * .62);height:calc(var(--dshw-base) * .62);pointer-events:none;z-index:2;filter:drop-shadow(0 8px 7px rgba(0,0,0,.36))}
     .dshwv-dsh-sprite{position:absolute;inset:0;background-repeat:no-repeat;background-position:0 0;background-size:100% 100%;image-rendering:auto}
     /* manifest 的 motion 字段：动效挂 stage（sprite 的 transform 留给走路朝向翻转）。 */
     .dshwv-dsh-stage[data-motion="tilt"]{animation:dshwv-tilt 1.2s ease-in-out infinite}
     .dshwv-dsh-stage[data-motion="wiggle"]{animation:dshwv-wiggle 1.2s ease-in-out infinite}
     .dshwv-dsh-stage[data-motion="shake"]{animation:dshwv-shake .4s linear infinite}
     .dshwv-dsh-stage[data-motion="float"]{animation:dshwv-float 2.6s ease-in-out infinite}
     @keyframes dshwv-tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}70%{transform:rotate(4deg)}}
     @keyframes dshwv-wiggle{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
     @keyframes dshwv-shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
     @keyframes dshwv-float{50%{transform:translateY(-4px)}}
     @media (prefers-reduced-motion:reduce){.dshwv-dsh-stage[data-motion]{animation:none}}
     .dshwv-dsh-pulse{position:absolute;right:70%;bottom:72%;min-width:118px;max-width:170px;padding:8px 11px;color:#f1f2f4;background:rgba(37,38,40,.97);border:1px solid rgba(255,255,255,.12);border-radius:11px;box-shadow:0 8px 20px rgba(0,0,0,.3);font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;opacity:0;transform:translateY(5px) scale(.98);transition:opacity .13s ease,transform .16s ease;pointer-events:none}
     .dshwv-dsh-stage:hover .dshwv-dsh-pulse,.dshwv-dsh-error .dshwv-dsh-pulse{opacity:1;transform:none}
     .dshwv-dsh-state{display:block;font-size:12px;font-weight:650;white-space:nowrap}
     .dshwv-dsh-detail{display:block;margin-top:3px;color:#b3b6bc;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
     .dshwv-classic .dshwv-dsh-stage{display:none}
     .dshwv-classic .dshwv-body{display:block}
    body.dshwv-live-scale .dshwv-root,body.dshwv-live-scale .dshwv-menu,body.dshwv-live-scale .dshwv-img{transition:none!important}
    .dshwv-bubble{position:absolute;left:0;top:0;width:100%;aspect-ratio:1026/700;pointer-events:none;z-index:1}
    .dshwv-bubble svg{display:block;width:100%;height:100%;pointer-events:none}
    .dshwv-bubble svg path,.dshwv-bubble svg ellipse{pointer-events:none;cursor:pointer}
    .dshwv-bubble.dshwv-bubble-open svg path,.dshwv-bubble.dshwv-bubble-open svg ellipse{pointer-events:visiblePainted}
    .dshwv-bubble .dshwv-bshape,.dshwv-bubble .dshwv-b1,.dshwv-bubble .dshwv-b2{opacity:0;transform:scale(.7);transform-box:fill-box;transform-origin:50% 50%;transition:opacity .2s ease,transform .2s ease}
    .dshwv-bubble.dshwv-bubble-open .dshwv-bshape,.dshwv-bubble.dshwv-bubble-open .dshwv-b1,.dshwv-bubble.dshwv-bubble-open .dshwv-b2{opacity:1;transform:none}
    .dshwv-bubble.dshwv-bubble-open .dshwv-b2{transition-delay:0s}
    .dshwv-bubble.dshwv-bubble-open .dshwv-b1{transition-delay:.13s}
    .dshwv-bubble.dshwv-bubble-open .dshwv-bshape{transition-delay:.26s}
    .dshwv-bubble .dshwv-bshape{transition-delay:.1s}
    .dshwv-bubble .dshwv-b1{transition-delay:.2s}
    .dshwv-bubble .dshwv-b2{transition-delay:.3s}
    .dshwv-text{position:absolute;left:44.25%;top:38%;transform:translate(-50%,-50%);text-align:center;color:#536ba9;line-height:1.15;white-space:nowrap;--dshw-u:calc(var(--dshw-base) / 1026);pointer-events:none;opacity:0;transition:opacity .16s ease,transform .3s ease}
    .dshwv-bubble.dshwv-bubble-open .dshwv-text{opacity:1;transition:opacity .16s ease .36s,transform .3s ease}
    .dshwv-root.dshwv-left .dshwv-text{transform:translate(-50%,-50%) scaleX(-1)}
    .dshwv-label{font-size:calc(var(--dshw-u) * 66);font-weight:600;letter-spacing:.06em}
    .dshwv-sub{font-size:calc(var(--dshw-u) * 52);color:#9fb0d9;letter-spacing:.02em;margin-top:calc(var(--dshw-u) * 2)}
    .dshwv-amount{font-size:calc(var(--dshw-u) * 128);font-weight:800;line-height:1.05}
    .dshwv-period{font-size:calc(var(--dshw-u) * 104);font-weight:800;line-height:1.05}
    .dshwv-wrap{white-space:normal;max-width:calc(var(--dshw-u) * 560);line-height:1.2}
    .dshwv-hint{font-size:calc(var(--dshw-u) * 56);color:#9fb0d9;letter-spacing:.02em;margin-top:calc(var(--dshw-u) * 9)}
    .dshwv-menu-btn{position:absolute;top:calc(40.55% + 4px);right:4px;width:26px;height:26px;border:none;border-radius:6px;background:rgba(32,49,112,.85);cursor:pointer;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;z-index:2;opacity:0;transition:opacity .15s ease}
    .dshwv-menu-btn.dshwv-menu-btn-visible{opacity:1}
    .dshwv-menu-btn span{display:block;width:14px;height:2px;background:#fff;border-radius:1px}
    .dshwv-menu-btn:hover{background:#203170}
    .dshwv-menu{position:fixed;min-width:172px;width:max-content;background:rgba(255,255,255,.92);border:1px solid rgba(32,49,112,.35);border-radius:10px;padding:10px 12px;opacity:0;transform:scale(.92) translateY(-4px);transform-origin:top right;transition:opacity .18s ease,transform .2s cubic-bezier(.34,1.56,.64,1),left .18s ease,top .18s ease;pointer-events:none;z-index:10000;box-shadow:0 6px 18px rgba(0,0,0,.18);color-scheme:light}
    .dshwv-menu.dshwv-menu-open{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
    .dshwv-menu-row{display:flex;align-items:center;gap:8px;margin:5px 0;color:#203170;font-size:12px;white-space:nowrap}
    .dshwv-range{flex:1;min-width:0;accent-color:#203170}
    .dshwv-number{width:46px;border:1px solid rgba(32,49,112,.4);border-radius:6px;padding:2px 4px;font-size:12px;color:#203170;background:#fff}
    .dshwv-sound{flex:1;border:1px solid rgba(32,49,112,.4);border-radius:6px;background:rgba(32,49,112,.08);color:#203170;font-size:12px;padding:3px 0;cursor:pointer}
    .dshwv-sound:hover{background:rgba(32,49,112,.16)}
    .dshwv-volpct{width:36px;text-align:right;color:#203170;font-size:12px}
    .dshwv-setbtn{flex:1;border:none;border-radius:8px;background:#2fa24c;color:#fff;font-size:12px;padding:7px 0;cursor:pointer;margin:4px 0 2px}
    .dshwv-setbtn:hover{background:#268a40}
  </style>
</head>
<body>
  <script src="widget.js"></script>
</body>
</html>
